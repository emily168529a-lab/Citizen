<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stakeholder Access Portal · Role Access & OTP</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--ink:#1b1a16;--mut:#6a665b;--line:#e2dccf;--acc:#c2410c;--ok:#0f766e;--hi:#fff1e6;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120d;--card:#201d15;--ink:#f0ebdf;--mut:#a29c8c;--line:#38332a;--acc:#fb923c;--ok:#2dd4bf;--hi:#2d2216;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#14120d;--card:#201d15;--ink:#f0ebdf;--mut:#a29c8c;--line:#38332a;--acc:#fb923c;--ok:#2dd4bf;--hi:#2d2216;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:16px}
h1{font:600 24px Georgia,serif;margin:0}h2{font:600 16px Georgia,serif;margin:0 0 8px}
.m{color:var(--mut);font-size:12px}
.g{display:grid;gap:12px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:880px){.g{grid-template-columns:420px 1fr}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.st{display:flex;gap:6px;margin-bottom:12px}
.st i{flex:1;height:4px;border-radius:2px;background:var(--line)}.st i.on{background:var(--acc)}
.roles{display:grid;gap:6px;margin:8px 0}
.ro{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--card);text-align:left;color:var(--ink);font:inherit}
.ro.on{border-color:var(--acc);background:var(--hi)}.ro b{display:block}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.ph{display:flex;gap:6px}.ph span{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.otp{display:flex;gap:6px;justify-content:space-between}
.otp input{width:100%;min-width:0;text-align:center;font-size:20px;padding:10px 0}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:11px;border-radius:9px;border:0;background:var(--acc);color:#fff;font-weight:600;margin-top:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lk{background:none;border:0;color:var(--acc);padding:4px 0;font-size:13px}.lk:disabled{color:var(--mut)}
.cons{display:flex;gap:8px;margin:10px 0 0;font-size:12px;color:var(--mut)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.sms{background:var(--hi);border:1px dashed var(--acc);border-radius:10px;padding:8px 10px;margin:10px 0;font-size:13px}
.sms b{font:700 18px ui-monospace,monospace;letter-spacing:3px}
.hide{display:none}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:12px}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th.on,td.on{background:var(--hi)}
.f{color:var(--ok);font-weight:700}.v{color:#b45309}.o{color:#6d28d9}.n{color:var(--mut)}
.lg{max-height:170px;overflow:auto;font:11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);font-size:11px;margin:2px 2px 0 0}
.pill.ok{background:var(--ok);color:#fff}
</style></head><body><div class="w">
<h1>Stakeholder Access Portal</h1>
<div class="m">Role-based access and OTP sign-in · demo front end, no server · India-hosted deployment assumed</div>
<div class="g">
<div class="c" id="box"></div>
<div class="c"><h2>Role access matrix</h2><div class="m" style="margin-bottom:8px">F = full, V = view only, O = own records only. Your selected role is highlighted.</div><div class="sc"><table id="mx"></table></div></div>
</div></div>
